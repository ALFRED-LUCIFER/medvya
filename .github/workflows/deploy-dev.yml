name: deploy-dev

# Tagged deploy of the API to the India dev environment (MDV-P0-007). Signs in to Azure with GitHub OIDC; no secret is stored.
# The database is private (MDV-P0-038), so this runner never connects to it. Migrations run inside the VNet (MDV-P0-042): the runner
# uploads db-migrate to Blob and starts the Container Apps job from infra/bicep/main.bicep, which applies infra/postgres/roles.sql as its
# administrator identity, maps the app and migrator logins, then migrates as medvya_migrator. The app ships only after the job succeeds.
# shortcut: no staging slot; the web app ships inside the API (/app/). Staging with a slot swap comes with production (MDV-P1-039).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  checks: read
  actions: read # to wait for the pr run on this commit

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # up to 25 waiting for CI, then about 13 to deploy
    environment: dev # the federated credential trusts this environment only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard below needs main's history
      # Only code that is on main ships: a tag on another commit, or a manual run from a branch, stops here before any Azure sign-in.
      - name: Refuse commits that are not on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main; tag a commit on main"; exit 1; }
          # A manual run from main is named after the last release and the commits since (0.0.19-24-g5955422), never 0.0.0-main (UX-08).
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo v0.0.0-main); fi
          echo "VERSION=${v#v}" >> "$GITHUB_ENV"
      # main can hold a commit CI never passed (a merge that was not up to date, a run still going): only a verified commit ships (#1249).
      - name: Refuse a commit whose CI is not green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A deploy started right after a merge waits for that commit's pr run (up to 25 minutes) instead of failing on a check
          # that has not finished yet. It still ships only when the run ends green.
          for i in $(seq 1 50); do
            running=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pr.yml --commit "$GITHUB_SHA" --json status --jq '[.[]|select(.status!="completed")]|length')
            [ "$running" = 0 ] && break
            echo "CI on $GITHUB_SHA is still running; waiting ($i/50)"; sleep 30
          done
          for check in dotnet web secrets; do
            got=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check" --jq '.check_runs|sort_by(.started_at)|last|.conclusion // "not finished or never run"')
            [ "$got" = success ] || { echo "::error::check '$check' on $GITHUB_SHA is '$got'; deploy a commit on main whose pr run is green"; exit 1; }
          done
      # Copy this workflow for another environment and the draft terms stop it (counsel sign-off, MDV-P1-044).
      - run: bash tools/check-legal-marker.sh dev
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm --filter clinic build
      # /health reports this version plus the commit (+sha), which the smoke test checks.
      # ReadyToRun (precompiled, needs the runtime id): a restart on the one-core B1 JITs less before the first requests answer (#912).
      # The build-time OpenAPI export is skipped: nothing serves it, PR CI checks it, and it fails on a runtime-specific publish off Linux x64.
      - run: dotnet publish src/Host.Api -c Release -r linux-x64 --self-contained false -p:PublishReadyToRun=true -p:OpenApiGenerateDocuments=false -o publish -p:Version="$VERSION"
      # The API serves the built web app under /app/ (same origin as the sign-in cookie).
      - run: mkdir -p publish/wwwroot/app && cp -R web/clinic/dist/. publish/wwwroot/app/
      # Self-contained, so the job's image needs no .NET.
      - run: |
          dotnet publish tools/db-migrate -c Release -r linux-x64 --self-contained -o db-migrate
          tar -czf db-migrate.tar.gz -C db-migrate .
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Migrate database (job inside the VNet)
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          STORAGE: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          JOB: ${{ vars.AZURE_DB_JOB }}
        run: |
          az storage blob upload --auth-mode login --account-name "$STORAGE" -c deploy -n db-migrate.tar.gz -f db-migrate.tar.gz --overwrite -o none
          execution=$(az containerapp job start -g "$RG" -n "$JOB" --query name -o tsv)
          echo "Started $execution"
          for _ in $(seq 1 120); do
            status=$(az containerapp job execution show -g "$RG" -n "$JOB" --job-execution-name "$execution" --query properties.status -o tsv)
            case "$status" in
              Succeeded) echo "Database job succeeded"; exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::Database job $execution ended $status; its log is in Log Analytics (ContainerAppConsoleLogs_CL)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Database job $execution did not finish in 20 minutes"; exit 1
      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
      # The app restarts after the deploy; give it up to 5 minutes to answer with the new build before failing.
      # shortcut: no signed-in check (MFA needs a person); this proves the build, the web app and the identity provider config, not a sign-in.
      - name: Smoke test
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          base="https://$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)"
          expected="$VERSION+$GITHUB_SHA"
          for _ in $(seq 1 30); do
            got=$(curl -fsS "$base/health" | jq -r .version) && [ "$got" = "$expected" ] && break
            sleep 10
          done
          [ "$got" = "$expected" ] || { echo "::error::/health reports '$got', expected '$expected'"; exit 1; }
          curl -fsS -o /dev/null "$base/app/" || { echo "::error::the web app is not served at /app/"; exit 1; }
          # A challenge redirect proves the OpenID Connect settings load and the provider's metadata is reachable.
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' "$base/bff/login")
          case "$location" in *"/oauth2/v2.0/authorize"*) echo "Smoke test passed: $got" ;; *) echo "::error::/bff/login did not redirect to the identity provider (got '$location')"; exit 1 ;; esac
