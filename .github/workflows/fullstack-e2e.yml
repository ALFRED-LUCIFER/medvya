name: fullstack-e2e

# MDV-P0-029: the browser against the real Host.Api and a real PostgreSQL in Docker, no mocked APIs (tests/e2e/fullstack).
# Not a required check yet: it runs nightly, on demand, and on PRs that touch the code it exercises, until it has a record of being stable on the
# runners. Then move the job into pr.yml (the timeout below is its budget). Synthetic data only; nothing here touches Azure.
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      # The code under test too: #1163 changed only src/ and merged with J2 broken (MDV-P0-028 regression, #1232).
      - 'src/**'
      - 'web/**'
      - 'packages/**'
      - 'tests/e2e/fullstack/**'
      - 'tests/e2e/journeys/storyboard.ts' # the full-stack J2 to J6 specs read their steps through it
      - 'docs/02-design/journeys.md'
      - '.github/workflows/fullstack-e2e.yml'

permissions:
  contents: read

concurrency:
  group: fullstack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:fullstack # stack.mjs builds the web app and the API, starts PostgreSQL in Docker, seeds, serves; removed on exit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fullstack-traces
          path: tests/e2e/test-results
          retention-days: 7
