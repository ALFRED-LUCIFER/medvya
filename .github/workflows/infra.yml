name: infra

# Applies infra/bicep/main.bicep with infra/bicep/<environment>.bicepparam (MDV-P0-006): what-if first, then the real deployment only after a
# reviewer approves the `<environment>-infra` GitHub environment. Manual runs from main only. Both jobs use `<environment>-infra`, whose
# identity is Owner on that resource group (the template creates role and policy assignments) and is trusted for that environment only;
# the app deploy identity (environment `<environment>`) is only Contributor. Setup: docs/runbooks/environments.md.
# The repository is public, so its run logs are too: the alert email and the administrator's sign-in name are secrets (masked in logs),
# and the what-if prints resource ids only, not property values.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, test]
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  PARAMS: infra/bicep/${{ inputs.environment }}.bicepparam
  # Read by the .bicepparam file (readEnvironmentVariable). Entra ids, not secrets.
  DB_ADMIN_OBJECT_ID: ${{ vars.AZURE_DB_ADMIN_OBJECT_ID }}
  OIDC_CLIENT_ID: ${{ vars.STAFF_SIGNIN_CLIENT_ID }}
  DEPLOY_PRINCIPAL_ID: ${{ vars.AZURE_DEPLOY_PRINCIPAL_ID }}
  # Platform console (docs/runbooks/platform-console-azure.md): its app registration and first owner.
  CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_SIGNIN_CLIENT_ID }}
  CONSOLE_OWNER_OBJECT_ID: ${{ vars.CONSOLE_OWNER_OBJECT_ID }}

jobs:
  what-if:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A what-if checks permissions like a deployment, so it needs the Owner identity: approve it (it changes nothing), read it, then approve
    # the deploy job. Two approvals, but the token that can change Azure never runs a step nobody looked at.
    environment: ${{ inputs.environment }}-infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse commits that are not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (read this before approving the deployment)
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DB_ADMIN_LOGIN: ${{ secrets.AZURE_DB_ADMIN_LOGIN }}
        run: az deployment group what-if -g "$RG" -p "$PARAMS" --exclude-change-types NoChange Ignore --result-format ResourceIdOnly

  deploy:
    needs: what-if
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}-infra # required reviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DB_ADMIN_LOGIN: ${{ secrets.AZURE_DB_ADMIN_LOGIN }}
        run: az deployment group create -g "$RG" -n "infra-${{ inputs.environment }}-$GITHUB_RUN_NUMBER" -p "$PARAMS" -o none
