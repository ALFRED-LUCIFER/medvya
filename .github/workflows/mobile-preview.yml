name: mobile-preview

# Installable preview builds of both Expo apps (MDV-P5-032 AC 1, owner decision 15 Nov 2026): an Android APK and an iOS
# simulator app per app, built on the runners, kept as run artifacts. No Expo or Apple account and no secrets; EAS comes
# with the store release (MDV-P5-039). Type-check, lint, tests and the JS bundle run on every PR in pr.yml (web-checks).
# Not a required check. Download and install: docs/05-delivery/session-handoff.md §8.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/i18n/**'
      - 'packages/tokens/**'
      - 'packages/ui-native/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-preview.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/i18n/**'
      - 'packages/tokens/**'
      - 'packages/ui-native/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }} ${{ matrix.platform }}
    # iOS on macOS (free minutes on a public repo); macos-26 for the Xcode 26 that React Native 0.88 builds with.
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [clinician, patient]
        platform: [android, ios]
    env:
      # The preview signs in against the Azure dev API (docs/releases/r0.md); inlined into the JS bundle at build time.
      EXPO_PUBLIC_MEDVYA_API: https://app-medvya-dev-3afs7i.azurewebsites.net
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # android/ and ios/ are generated here from app.json and the config plugins (gitignored, never committed).
      - name: Android APK
        if: matrix.platform == 'android'
        # The release variant is signed with the debug keystore of the prebuild template: an internal preview only, never a
        # store build (store signing comes with MDV-P5-039). arm64 for phones, x86_64 for the emulator.
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          pnpm exec expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/medvya-${{ matrix.app }}.apk"

      - name: iOS simulator app
        if: matrix.platform == 'ios'
        # A simulator build needs no signing, so no Apple account.
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          cd ios && pod install
          scheme=$(basename ./*.xcworkspace .xcworkspace)
          xcodebuild -workspace "$scheme.xcworkspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO
          # ditto keeps the bundle's executable bits and symlinks, which the artifact zip alone would drop.
          ditto -c -k --keepParent "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/$scheme.app" \
            "$RUNNER_TEMP/medvya-${{ matrix.app }}-simulator.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medvya-${{ matrix.app }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/medvya-${{ matrix.app }}*.${{ matrix.platform == 'ios' && 'zip' || 'apk' }}
          if-no-files-found: error
          retention-days: 14
