name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides which heavy jobs run. A skipped job counts as passed for the required checks, so a docs-only change
    # does not wait for the .NET and browser suites. Pushes to main always run everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      web: ${{ steps.f.outputs.web }}
      e2e: ${{ steps.f.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PR: HEAD is the merge commit, its first parent the base tip. Push to main: the commits the push added (squash merge = one).
          if [ "$EVENT" = "pull_request" ]; then base=HEAD^1; else base="$BEFORE"; fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; echo "e2e=true" >> "$GITHUB_OUTPUT"; exit 0   # no usable base: run everything
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          # infra/postgres only: the integration fixture applies roles.sql; Bicep and Entra scripts are not built or tested here.
          echo "backend=$(has '^(src/|tests/Medvya\.|Directory\.|global\.json|Medvya\.sln|dotnet-tools\.json|infra/postgres/|tools/erd/|docs/03-architecture/erd\.md|packages/api-client/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(has '^(web/|mobile/|packages/|tests/e2e/|package\.json|pnpm-|tools/check-synthetic/|\.github/)')" >> "$GITHUB_OUTPUT"
          # The browser suite drives the web apps only; no web screen imports mobile/ (ADR-013), so a mobile-only change skips it (#1129).
          echo "e2e=$(has '^(web/|packages/|tests/e2e/|package\.json|pnpm-|\.github/)')" >> "$GITHUB_OUTPUT"

  dotnet-checks:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ERD is current
        # a model or migration change must regenerate docs/03-architecture/erd.md in the same PR (AGENTS.md 3.6)
        run: python3 -I tools/erd/generate.py --check
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Medvya.sln # analyzers run as part of the build; warnings are errors (Directory.Build.props)
      - run: dotnet test tests/Medvya.ArchitectureTests --no-build && dotnet test tests/Medvya.SecurityTests --no-build
      - name: Vulnerable NuGet packages
        # shortcut: substitutes for GitHub dependency review, which needs Advanced Security on private repos
        run: |
          dotnet package list --project Medvya.sln --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  dotnet-integration:
    # The integration suite (one PostgreSQL container per test class) was one 10 min job; it is split by test class over 4 machines.
    # "Re-run failed jobs" then repeats only the shard that failed.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARDS: 4
      PROJECT: tests/Medvya.IntegrationTests/Medvya.IntegrationTests.csproj
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build "$PROJECT"
      - name: Integration tests, shard ${{ matrix.shard }} of 4
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Test classes, sorted, dealt round-robin to shards 1..N-1. The last shard runs everything NOT dealt to the others,
          # so a class the listing misses (or a new one) still runs: no test can fall between shards.
          dotnet test "$PROJECT" --no-build --list-tests | sed -n 's/^    //p' | grep '^Medvya\.' | sed -E 's/\(.*//; s/\.[^.]+$//' | sort -u > classes.txt
          echo "$(wc -l < classes.txt) test classes"
          if [ "$SHARD" -lt "$SHARDS" ]; then
            filter=$(awk -v s="$SHARD" -v n="$SHARDS" '(NR-1)%n==s-1 {printf "%sFullyQualifiedName~%s.", (c++?"|":""), $0}' classes.txt)
          else
            filter=$(awk -v n="$SHARDS" '(NR-1)%n!=n-1 {printf "%sFullyQualifiedName!~%s.", (c++?"&":""), $0}' classes.txt)
          fi
          [ -n "$filter" ] || { echo "::error::empty filter for shard $SHARD"; exit 1; }
          dotnet test "$PROJECT" --no-build --filter "$filter"

  dotnet:
    # The required check name: passes only when the checks and every integration shard passed (a skipped backend change counts as pass).
    needs: [changes, dotnet-checks, dotnet-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ needs.changes.result }}" = success ] || exit 1
          if [ "${{ needs.changes.outputs.backend }}" = true ]; then
            [ "${{ needs.dotnet-checks.result }}" = success ] && [ "${{ needs.dotnet-integration.result }}" = success ]
          fi

  web-checks:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r build # includes tsc type-checking
      - run: pnpm -r test
      - run: pnpm audit --audit-level high
      - run: node tools/check-synthetic/check.mjs --self-test && node tools/check-synthetic/check.mjs

  web-e2e:
    # Playwright split over 5 machines (one 14 min run, then 3 shards of 5-8 min). The performance budget runs alone on its own machine:
    # with project dependencies Playwright puts every test in shard 1, so shards pass --project=chromium.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        args: ['--project=chromium --shard=1/5', '--project=chromium --shard=2/5', '--project=chromium --shard=3/5', '--project=chromium --shard=4/5', '--project=chromium --shard=5/5', '--project=performance --no-deps']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build # the first-render budget runs against the production build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e e2e ${{ matrix.args }}
      - name: Keep the Playwright report when e2e fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: tests/e2e/playwright-report
          retention-days: 7

  web:
    # The required check name: passes only when the checks and every e2e job passed (a skipped web change counts as pass).
    needs: [changes, web-checks, web-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ needs.changes.result }}" = success ] || exit 1
          if [ "${{ needs.changes.outputs.web }}" = true ]; then [ "${{ needs.web-checks.result }}" = success ]; fi
          if [ "${{ needs.changes.outputs.e2e }}" = true ]; then [ "${{ needs.web-e2e.result }}" = success ]; fi

  contract:
    # The generated TypeScript client must match what Host.Api exports (packages/api-client). Not a required check yet.
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash tools/check-contract.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Synthetic data only (runs here too so a docs-only change is still scanned)
        run: node tools/check-synthetic/check.mjs --self-test && node tools/check-synthetic/check.mjs
      - name: Relative Markdown links resolve
        run: python3 -I tools/check-links/check.py --self-test && python3 -I tools/check-links/check.py
      - name: Draft terms block any deploy beyond dev (MDV-P1-067)
        run: bash tools/check-legal-marker.sh dev && ! bash tools/check-legal-marker.sh pilot
      - name: Generated ticket pages are current
        run: |
          python3 -I tools/tickets/build.py
          test -z "$(git status --porcelain docs/05-delivery/tickets)" || { git status --short docs/05-delivery/tickets; echo "run python3 -I tools/tickets/build.py and commit"; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # shortcut: gitleaks stands in for GitHub secret scanning + push protection (Advanced Security on private repos); switch when the repo gets it
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
