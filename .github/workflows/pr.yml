name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides which heavy jobs run. A skipped job counts as passed for the required checks, so a docs-only change
    # does not wait for the .NET and browser suites. Pushes to main always run everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)   # HEAD is the PR merge commit: first parent is the base tip
          echo "$files"
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          echo "backend=$(has '^(src/|tests/Medvya\.|Directory\.|global\.json|Medvya\.sln|dotnet-tools\.json|infra/|tools/erd/|docs/03-architecture/erd\.md|packages/api-client/|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(has '^(web/|mobile/|packages/|tests/e2e/|package\.json|pnpm-|tools/check-synthetic/|\.github/)')" >> "$GITHUB_OUTPUT"

  dotnet:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # the .NET suite runs about 6.5 min and is growing
    steps:
      - uses: actions/checkout@v7
      - name: ERD is current
        # a model or migration change must regenerate docs/03-architecture/erd.md in the same PR (AGENTS.md 3.6)
        run: python3 -I tools/erd/generate.py --check
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Medvya.sln # analyzers run as part of the build; warnings are errors (Directory.Build.props)
      - run: dotnet test Medvya.sln --no-build
      - name: Vulnerable NuGet packages
        # shortcut: substitutes for GitHub dependency review, which needs Advanced Security on private repos
        run: |
          dotnet package list --project Medvya.sln --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # e2e ran past 10 min once it grew beyond ~250 specs; a timeout caps a hung run, it is not a test threshold
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r build # includes tsc type-checking
      - run: pnpm -r test
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e e2e
      - name: Keep the Playwright report when e2e fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - run: pnpm audit --audit-level high
      - run: node tools/check-synthetic/check.mjs --self-test && node tools/check-synthetic/check.mjs

  contract:
    # The generated TypeScript client must match what Host.Api exports (packages/api-client). Not a required check yet.
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash tools/check-contract.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Synthetic data only (runs here too so a docs-only change is still scanned)
        run: node tools/check-synthetic/check.mjs --self-test && node tools/check-synthetic/check.mjs
      - name: Relative Markdown links resolve
        run: python3 -I tools/check-links/check.py --self-test && python3 -I tools/check-links/check.py
      - name: Generated ticket pages are current
        run: |
          python3 -I tools/tickets/build.py
          test -z "$(git status --porcelain docs/05-delivery/tickets)" || { git status --short docs/05-delivery/tickets; echo "run python3 -I tools/tickets/build.py and commit"; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # shortcut: gitleaks stands in for GitHub secret scanning + push protection (Advanced Security on private repos); switch when the repo gets it
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
