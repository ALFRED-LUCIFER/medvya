# Local development only. Synthetic data only; never point this at real patient data.
name: medvya

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medvya
      POSTGRES_USER: medvya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Local_dev_only_1}
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U medvya -d medvya"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --loose
    ports: ["10000:10000"]
    volumes: [azurite-data:/data]

  mail:
    image: rnwood/smtp4dev:latest # catches all outgoing email; UI on http://localhost:5025
    ports: ["2525:25", "5025:80"]

volumes:
  pg-data:
  azurite-data:
